[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bible-app"
version = "0.0.0"
description = "Bible Search App Backend"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [{name = "BSP Org", email = "biblesearchproject@gmail.com"}]
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.3",
    "peewee==3.17.7",
    "psycopg2-binary==2.9.10",
    "pydantic==2.8.2",
    "pydantic-core==2.20.1",
    "pydantic-settings==2.2.1",
    "python-dotenv==1.0.1",
    "typing-extensions==4.12.2",
    "requests==2.31.0",
    "PyJWT==2.10.1",
    "passlib[bcrypt]==1.7.4",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-asyncio==0.23.6",
    "httpx==0.27.0",
    "coverage[toml]==7.5.4",
    "ruff==0.5.4",
    "mypy==1.10.0",
    "pre-commit==3.7.1",
    "asgi-lifespan==2.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
omit = ["tests/*"]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_return_any = false
warn_unused_ignores = true
warn_unreachable = true
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]
